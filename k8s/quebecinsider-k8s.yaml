apiVersion: v1
kind: Namespace
metadata:
  name: quebecinsider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quebecinsider-api
  namespace: quebecinsider
  labels:
    app: quebecinsider-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quebecinsider-api
  template:
    metadata:
      labels:
        app: quebecinsider-api
    spec:
      containers:
        - name: api
          image: ghcr.io/skmscinfo/quebecinsider-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quebecinsider-api-service
  namespace: quebecinsider
spec:
  type: LoadBalancer
  selector:
    app: quebecinsider-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quebecinsider-api-hpa
  namespace: quebecinsider
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quebecinsider-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70